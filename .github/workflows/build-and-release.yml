name: Build & Auto-Release JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build Mod JAR & Run Tests
        run: gradle build --no-daemon

      - name: Find & Verify Built Mod JAR
        id: find_jar
        run: |
          JAR_PATH=$(ls build/libs/banglaclient-*.jar | grep -v "\-sources\.jar" | grep -v "\-dev\.jar" | head -n 1)
          if [ -z "$JAR_PATH" ] || [ ! -f "$JAR_PATH" ]; then
            echo "JAR file not found!"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Verified JAR: $JAR_PATH"

      - name: Upload JAR to GitHub Releases Automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          TITLE="BANGLA CLIENT v1.0.0 (Build #${{ github.run_number }})"
          NOTES="Automatic JAR release built from commit ${{ github.sha }} (Minecraft 1.21.11 Fabric - PYES Structure + AURA Theme)."
          gh release create "$TAG" "${{ steps.find_jar.outputs.jar_path }}" --title "$TITLE" --notes "$NOTES"
