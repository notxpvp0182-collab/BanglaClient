name: Build & Auto-Release BANGLA CLIENT JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Validate & Build Mod JAR
        run: ./gradlew build --no-daemon

      - name: Verify Built JAR Exists
        id: verify_jar
        run: |
          JAR_FILE=$(ls build/libs/banglaclient-*.jar | grep -v "\-sources\.jar" | grep -v "\-dev\.jar" | head -n 1)
          if [ -z "$JAR_FILE" ] || [ ! -f "$JAR_FILE" ]; then
            echo "Error: Mod JAR was not generated!"
            exit 1
          fi
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT
          echo "Verified JAR: $JAR_FILE"

      - name: Automatically Create GitHub Release & Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: "BANGLA CLIENT v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ### BANGLA CLIENT — Automatic Build Release
            - **Minecraft Version:** 1.21.11 (Fabric)
            - **Build Number:** #${{ github.run_number }}
            - **Commit:** `${{ github.sha }}`
            - **UI Design:** PYES Structure + AURA Frosted Dark Glass
          files: ${{ steps.verify_jar.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
