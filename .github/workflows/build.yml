name: Build BANGLA CLIENT Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Ensure LICENSE file exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "BANGLA CLIENT v1.0.0 - Developed by Ahmed" > LICENSE
          fi

      - name: Build Distributable Mod Jar
        run: gradle build --no-daemon

      - name: Upload Built BANGLA CLIENT .jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaClient-1.21.11-Fabric-Jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
