import java.awt.Color
import java.awt.Font
import java.awt.GradientPaint
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu integration
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // JUnit 5 for offline unit verification
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.0'
}

tasks.register('generateModIcon') {
    def iconFile = file('src/main/resources/assets/banglaclient/icon.png')
    def rawJpg = file('src/main/resources/assets/banglaclient/textures/gui/raw_bg.jpg')
    def bgFile = file('src/main/resources/assets/banglaclient/textures/gui/main_menu_background.png')
    outputs.files(iconFile, bgFile)
    doLast {
        if (!iconFile.exists()) {
            iconFile.parentFile.mkdirs()
            BufferedImage img = new BufferedImage(256, 256, BufferedImage.TYPE_INT_ARGB)
            def g = img.createGraphics()
            g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING, RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
            // Transparent outer margin + Dark Liquid Glass rounded shield
            g.setPaint(new GradientPaint(0f, 0f, new Color(24, 14, 22, 245), 256f, 256f, new Color(8, 10, 16, 255)))
            g.fillRoundRect(12, 12, 232, 232, 56, 56)
            // Glowing Red outer & inner border
            g.setColor(new Color(239, 68, 68, 235))
            g.drawRoundRect(12, 12, 232, 232, 56, 56)
            g.setColor(new Color(255, 255, 255, 90))
            g.drawRoundRect(16, 16, 224, 224, 50, 50)
            // Golden Crown emblem at top center
            g.setColor(new Color(251, 191, 36))
            g.fillRect(92, 42, 72, 14)
            g.fillRect(92, 28, 14, 16)
            g.fillRect(121, 22, 14, 22)
            g.fillRect(150, 28, 14, 16)
            // 3D Extruded "B" (Red) and "C" (White)
            g.setFont(new Font('SansSerif', Font.BOLD, 112))
            g.setColor(new Color(69, 10, 10))
            g.drawString('B', 50, 184)
            g.setColor(new Color(239, 68, 68))
            g.drawString('B', 46, 178)
            g.setColor(new Color(30, 41, 59))
            g.drawString('C', 132, 184)
            g.setColor(new Color(255, 255, 255))
            g.drawString('C', 128, 178)
            g.dispose()
            ImageIO.write(img, 'PNG', iconFile)
        }

        bgFile.parentFile.mkdirs()
        BufferedImage srcBg = null
        if (rawJpg.exists() && rawJpg.length() > 5000) {
            srcBg = ImageIO.read(rawJpg)
        }
        if (srcBg == null) {
            def url = new URL('https://i.postimg.cc/05X5w9Vm/0b436142caf939e1091ed9c1b48bd323.jpg')
            def conn = url.openConnection()
            conn.setRequestProperty('User-Agent', 'Mozilla/5.0')
            srcBg = ImageIO.read(conn.getInputStream())
        }
        if (srcBg != null) {
            int w = srcBg.getWidth()
            int h = srcBg.getHeight()
            BufferedImage argbPng = new BufferedImage(w, h, BufferedImage.TYPE_INT_ARGB)
            def g2 = argbPng.createGraphics()
            g2.drawImage(srcBg, 0, 0, w, h, null)
            g2.dispose()
            ImageIO.write(argbPng, 'PNG', bgFile)
        }
    }
}

processResources {
    dependsOn tasks.named('generateModIcon')
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version

    filesMatching('fabric.mod.json') {
        expand(
            'version': project.version,
            'minecraft_version': project.minecraft_version,
            'loader_version': project.loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
